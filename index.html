        /**
         * ROBUST VALIDATION HELPERS
         * Safe scope helpers for CSS parsing & DOM validation
         */
        const ValidationHelpers = {
            /**
             * Clean CSS from comments
             */
            cleanCSS(cssText) {
                return (cssText || '').replace(/\/\*[\s\S]*?\*\//g, '');
            },

            /**
             * Normalize color values to standard format for flexible comparison
             */
            normalizeColor(colorStr) {
                if (!colorStr) return '';
                const clean = colorStr.trim().toLowerCase();
                const colorMap = {
                    'purple': '#8b5cf6',
                    'violet': '#8b5cf6',
                    '#8b5cf6': '#8b5cf6',
                    'rgb(139, 92, 246)': '#8b5cf6',
                    '#7c3aed': '#7c3aed',
                    '#f5f3ff': '#f5f3ff',
                    '#f97316': '#f97316',
                    'white': '#ffffff',
                    '#ffffff': '#ffffff'
                };
                return colorMap[clean] || clean;
            },

            /**
             * Extract and parse CSS rules safely without evaluating code
             */
            parseCSS(rawCode) {
                const styleBlocks = [];
                const parser = new DOMParser();
                const doc = parser.parseFromString(rawCode, 'text/html');
                
                // Collect inner contents of all <style> tags
                const styles = doc.querySelectorAll('style');
                styles.forEach(s => styleBlocks.push(s.textContent || ''));

                const styleSheetText = styleBlocks.join('\n');
                const cleaned = this.cleanCSS(styleSheetText);

                return {
                    rawStyleText: styleSheetText,
                    cleanCSS: cleaned,
                    
                    // Checks if selector exists (e.g., '.card' or 'button' or 'h1')
                    hasSelector(selector) {
                        const escapedSel = selector.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        // Flexible regex matching `.card{` or `.card {`
                        const reg = new RegExp('(^|\\}|\\s)' + escapedSel + '\\s*\\{', 'i');
                        return reg.test(cleaned);
                    },

                    // Extract CSS property value for a selector safely (handles missing trailing semicolon)
                    getPropertyValue(selector, propName) {
                        const escapedSel = selector.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const blockReg = new RegExp(escapedSel + '\\s*\\{([^}]+)\\}', 'gi');
                        
                        let matchedValue = null;
                        let match;
                        while ((match = blockReg.exec(cleaned)) !== null) {
                            const declarations = match[1].split(';');
                            for (let decl of declarations) {
                                const parts = decl.split(':');
                                if (parts.length >= 2 && parts[0].trim().toLowerCase() === propName.toLowerCase()) {
                                    matchedValue = parts.slice(1).join(':').trim().toLowerCase();
                                }
                            }
                        }
                        return matchedValue;
                    }
                };
            }
        };

        /**
         * UNIFIED CODEMIRROR WORKSPACE CONTROLLER
         */
        class CodeStudioEditor {
            constructor(containerEl, initialCode = '', options = {}) {
                this.container = containerEl;
                this.onChangeCb = options.onChange || null;
                this.learningMode = options.learningMode || 'learn'; // 'learn' or 'challenge'
                this.fontSize = options.fontSize || 14;
                this.cmInstance = null;
                this.fallbackTextarea = null;

                this.initEditor(initialCode);
            }

            initEditor(code) {
                this.container.innerHTML = '';

                // Try initializing CodeMirror safely
                if (window.CodeMirror) {
                    try {
                        this.cmInstance = CodeMirror(this.container, {
                            value: code,
                            mode: 'htmlmixed',
                            theme: 'dracula',
                            lineNumbers: true,
                            styleActiveLine: true,
                            matchBrackets: true,
                            autoCloseTags: true,
                            autoCloseBrackets: true,
                            lineWrapping: true,
                            direction: 'ltr',
                            extraKeys: {
                                "Ctrl-Space": (cm) => this.triggerAutocomplete(cm),
                                "Cmd-Space": (cm) => this.triggerAutocomplete(cm)
                            }
                        });

                        // Set custom font size dynamically
                        this.setFontSize(this.fontSize);

                        // Attach change listener
                        this.cmInstance.on('change', () => {
                            if (this.onChangeCb) this.onChangeCb(this.getValue());
                            if (this.learningMode === 'learn') {
                                this.autoTriggerHintOnTyping();
                            }
                        });

                        return;
                    } catch (e) {
                        console.warn('CodeMirror initialization failed, fallback active:', e);
                    }
                }

                // Fallback Textarea Mode if CodeMirror fails to load
                this.fallbackTextarea = document.createElement('textarea');
                this.fallbackTextarea.className = 'w-full h-full bg-slate-950 text-emerald-400 font-mono text-sm p-4 rounded-xl focus:outline-none resize-none leading-relaxed';
                this.fallbackTextarea.dir = 'ltr';
                this.fallbackTextarea.spellcheck = false;
                this.fallbackTextarea.value = code;

                this.fallbackTextarea.addEventListener('input', () => {
                    if (this.onChangeCb) this.onChangeCb(this.getValue());
                });

                this.container.appendChild(this.fallbackTextarea);
            }

            getValue() {
                if (this.cmInstance) return this.cmInstance.getValue();
                return this.fallbackTextarea ? this.fallbackTextarea.value : '';
            }

            setValue(code) {
                if (this.cmInstance) {
                    this.cmInstance.setValue(code);
                } else if (this.fallbackTextarea) {
                    this.fallbackTextarea.value = code;
                }
            }

            focus() {
                if (this.cmInstance) this.cmInstance.focus();
                else if (this.fallbackTextarea) this.fallbackTextarea.focus();
            }

            destroy() {
                this.container.innerHTML = '';
                this.cmInstance = null;
                this.fallbackTextarea = null;
            }

            setFontSize(px) {
                this.fontSize = px;
                const cmEl = this.container.querySelector('.CodeMirror');
                if (cmEl) {
                    cmEl.style.fontSize = `${px}px`;
                    if (this.cmInstance) this.cmInstance.refresh();
                }
            }

            setLearningMode(mode) {
                this.learningMode = mode;
                if (this.cmInstance) {
                    this.cmInstance.setOption('autoCloseTags', mode === 'learn');
                    this.cmInstance.setOption('autoCloseBrackets', mode === 'learn');
                }
            }

            autoTriggerHintOnTyping() {
                if (!this.cmInstance || this.learningMode !== 'learn') return;
                const cursor = this.cmInstance.getCursor();
                const token = this.cmInstance.getTokenAt(cursor);

                if (token.string === '<' || token.string.length >= 2) {
                    this.triggerAutocomplete(this.cmInstance, true);
                }
            }

            triggerAutocomplete(cm, autoInsert = false) {
                if (!window.CodeMirror || !window.CodeMirror.showHint) return;

                CodeMirror.showHint(cm, () => {
                    const cursor = cm.getCursor();
                    const token = cm.getTokenAt(cursor);
                    const currentWord = token.string.replace(/[<"]/g, '').toLowerCase();

                    let completions = [];

                    // 1. Tags Autocomplete
                    if (token.string.startsWith('<') || token.type === 'tag') {
                        Object.keys(CODE_STUDIO_DICTIONARY.html).forEach(tag => {
                            if (tag.startsWith(currentWord)) {
                                completions.push({
                                    text: tag,
                                    displayText: `<${tag}> — ${CODE_STUDIO_DICTIONARY.html[tag]}`
                                });
                            }
                        });
                    } 
                    // 2. Attributes Autocomplete
                    else if (token.type === 'attribute') {
                        Object.keys(CODE_STUDIO_DICTIONARY.attrs).forEach(attr => {
                            if (attr.startsWith(currentWord)) {
                                completions.push({
                                    text: `${attr}=""`,
                                    displayText: `${attr} — ${CODE_STUDIO_DICTIONARY.attrs[attr]}`
                                });
                            }
                        });
                    }
                    // 3. CSS Properties & Values Autocomplete
                    else {
                        Object.keys(CODE_STUDIO_DICTIONARY.css).forEach(prop => {
                            if (prop.startsWith(currentWord)) {
                                completions.push({
                                    text: `${prop}: `,
                                    displayText: `${prop} — ${CODE_STUDIO_DICTIONARY.css[prop]}`
                                });
                            }
                        });
                    }

                    return {
                        list: completions,
                        from: CodeMirror.Pos(cursor.line, token.start + (token.string.startsWith('<') ? 1 : 0)),
                        to: CodeMirror.Pos(cursor.line, token.end)
                    };
                }, { completeSingle: false });
            }
        }

        /**
         * STATE MANAGEMENT & SECURE STORAGE
         */
        class CodeStudioApp {
            constructor() {
                this.state = {
                    currentView: 'home',
                    activeSectionId: 'sec-1',
                    activeActivityIdx: 0,
                    learningMode: 'learn', // 'learn' or 'challenge'
                    editorFontSize: 14,
                    user: {
                        name: 'مطورة مبدعة',
                        progress: {},
                        savedCode: {},
                        lastLocation: { sectionId: 'sec-1', activityIdx: 0 },
                        projectDrafts: {}
                    },
                    labState: {
                        overflow: { mode: 'visible', boxWidth: 280, boxHeight: 90, fontSize: 14, textLength: 'long' },
                        boxModel: { padding: 16, margin: 16 }
                    },
                    activeProject: 'club',
                    activeHintLevel: {}
                };

                this.activeEditorInstance = null;
                this.saveDebounceTimer = null;
                this.init();
            }

            init() {
                this.loadStateFromStorage();
                this.performSelfDiagnosticCheck();
                this.updateUserProfileUI();
                this.render();
            }

            performSelfDiagnosticCheck() {
                const missingSections = [];
                const corruptedActivities = [];

                CURRICULUM_DATA.sections.forEach(sec => {
                    const acts = CURRICULUM_DATA.activities[sec.id];
                    if (!acts || !Array.isArray(acts) || acts.length < 4) {
                        missingSections.push(sec.id);
                    } else {
                        acts.forEach((act, i) => {
                            if (!act.id || !act.title || !act.validation) {
                                corruptedActivities.push(`${sec.id}-act-${i}`);
                            }
                        });
                    }
                });

                if (missingSections.length > 0 || corruptedActivities.length > 0) {
                    const banner = document.getElementById('system-alert-banner');
                    if (banner) {
                        banner.classList.remove('hidden');
                        banner.textContent = `تنبيه النظام: جاري معالجة نقص في بيانات بـ (${missingSections.length}) أقسام لتأمين التجربة الكاملة.`;
                    }
                }
            }

            loadStateFromStorage() {
                try {
                    const savedName = localStorage.getItem('cs_user_name');
                    if (savedName) this.state.user.name = savedName;

                    const savedProg = localStorage.getItem('cs_user_progress');
                    if (savedProg) this.state.user.progress = JSON.parse(savedProg) || {};

                    const savedCode = localStorage.getItem('cs_saved_code');
                    if (savedCode) this.state.user.savedCode = JSON.parse(savedCode) || {};

                    const savedLoc = localStorage.getItem('cs_last_location');
                    if (savedLoc) this.state.user.lastLocation = JSON.parse(savedLoc) || { sectionId: 'sec-1', activityIdx: 0 };

                    const savedProjects = localStorage.getItem('cs_project_drafts');
                    if (savedProjects) this.state.user.projectDrafts = JSON.parse(savedProjects) || {};
                } catch (e) {
                    console.warn('Storage read warning:', e);
                    this.showToastNotification('تعذر قراءة بعض البيانات المحفوظة محلياً، تم بدء جلسة آمنة.');
                }
            }

            saveStateToStorage() {
                try {
                    localStorage.setItem('cs_user_name', this.state.user.name);
                    localStorage.setItem('cs_user_progress', JSON.stringify(this.state.user.progress));
                    localStorage.setItem('cs_saved_code', JSON.stringify(this.state.user.savedCode));
                    localStorage.setItem('cs_last_location', JSON.stringify(this.state.user.lastLocation));
                    localStorage.setItem('cs_project_drafts', JSON.stringify(this.state.user.projectDrafts));
                    this.updateUserProfileUI();
                    this.showSaveIndicator('حُفظ على هذا الجهاز');
                } catch (e) {
                    console.warn('Storage write failed:', e);
                    this.showSaveIndicator('تعذر الحفظ (التخزين ممتلئ أو معطل)');
                }
            }

            triggerDebouncedAutoSave(actId, code) {
                this.showSaveIndicator('جارٍ الحفظ...');
                this.state.user.savedCode[actId] = code;
                
                if (this.saveDebounceTimer) clearTimeout(this.saveDebounceTimer);
                this.saveDebounceTimer = setTimeout(() => {
                    this.saveStateToStorage();
                }, 800);
            }

            showSaveIndicator(text) {
                const el = document.getElementById('save-indicator-status');
                if (el) {
                    el.textContent = text;
                    el.className = text.includes('جارٍ') ? 'text-xs text-amber-500 font-medium' : 'text-xs text-emerald-600 font-medium';
                }
            }

            showToastNotification(msg) {
                const banner = document.getElementById('system-alert-banner');
                if (banner) {
                    banner.classList.remove('hidden');
                    banner.textContent = msg;
                    setTimeout(() => banner.classList.add('hidden'), 4000);
                }
            }

            updateUserProfileUI() {
                const nameEl = document.getElementById('user-display-name');
                const charEl = document.getElementById('user-avatar-char');
                const progEl = document.getElementById('user-progress-text');

                if (nameEl) nameEl.textContent = this.state.user.name;
                if (charEl) charEl.textContent = this.state.user.name.charAt(0) || 'م';

                const totalCompleted = Object.keys(this.state.user.progress).length;
                if (progEl) progEl.textContent = `${totalCompleted} نشاط مكتمل`;
            }

            navigateTo(view, sectionId = null, activityIdx = null) {
                this.saveCurrentActivityDraftImmediate();

                if (this.activeEditorInstance) {
                    this.activeEditorInstance.destroy();
                    this.activeEditorInstance = null;
                }

                this.state.currentView = view;

                if (sectionId && CURRICULUM_DATA.sections.some(s => s.id === sectionId)) {
                    this.state.activeSectionId = sectionId;
                }

                if (activityIdx !== null && activityIdx >= 0) {
                    this.state.activeActivityIdx = activityIdx;
                }

                if (view === 'activity') {
                    this.state.user.lastLocation = {
                        sectionId: this.state.activeSectionId,
                        activityIdx: this.state.activeActivityIdx
                    };
                    this.saveStateToStorage();
                }

                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            saveCurrentActivityDraftImmediate() {
                if (this.activeEditorInstance && this.state.currentView === 'activity') {
                    const currentAct = this.getCurrentActivity();
                    if (currentAct) {
                        this.state.user.savedCode[currentAct.id] = this.activeEditorInstance.getValue();
                        this.saveStateToStorage();
                    }
                }
            }

            getCurrentSection() {
                const sec = CURRICULUM_DATA.sections.find(s => s.id === this.state.activeSectionId);
                return sec || CURRICULUM_DATA.sections[0];
            }

            getCurrentActivity() {
                const sec = this.getCurrentSection();
                const acts = CURRICULUM_DATA.activities[sec.id] || [];
                if (acts.length === 0) return null;
                const idx = Math.min(this.state.activeActivityIdx, acts.length - 1);
                return acts[idx] || acts[0];
            }

            render() {
                const container = document.getElementById('app-container');
                container.innerHTML = '';

                switch (this.state.currentView) {
                    case 'home':
                        container.appendChild(this.renderHomeView());
                        break;
                    case 'sections':
                        container.appendChild(this.renderSectionsView());
                        break;
                    case 'activity':
                        container.appendChild(this.renderActivityView());
                        break;
                    case 'summary':
                        container.appendChild(this.renderSectionSummaryView());
                        break;
                    case 'labs':
                        container.appendChild(this.renderLabsView());
                        break;
                    case 'project':
                        container.appendChild(this.renderProjectView());
                        break;
                    default:
                        container.appendChild(this.renderHomeView());
                }
            }

                            onChange: (code) => {

                    this.runCodePreview();

            toggleLearningMode(mode) {
                this.state.learningMode = mode;
                if (this.activeEditorInstance) {
                    this.activeEditorInstance.setLearningMode(mode);
                }
                this.render();
            }

            changeEditorFontSize(delta) {
                this.state.editorFontSize = Math.max(12, Math.min(22, this.state.editorFontSize + delta));
                if (this.activeEditorInstance) {
                    this.activeEditorInstance.setFontSize(this.state.editorFontSize);
                }
            }

            triggerActiveAutocomplete() {
                if (this.activeEditorInstance && this.activeEditorInstance.cmInstance) {
                    this.activeEditorInstance.triggerAutocomplete(this.activeEditorInstance.cmInstance);
                }
            }

            runCodePreview() {
                const iframe = document.getElementById('preview-iframe');
                if (!iframe) return;

                const userCode = this.activeEditorInstance ? this.activeEditorInstance.getValue() : '';

                const currentAct = this.getCurrentActivity();
                if (currentAct) {
                    this.state.user.savedCode[currentAct.id] = userCode;
                }

                const isJsSection = this.state.activeSectionId === 'sec-10';
                if (isJsSection) {
                    iframe.removeAttribute('sandbox');
                } else {
                    iframe.setAttribute('sandbox', 'allow-same-origin');
                }

                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(`
                    <!DOCTYPE html>
                    <html dir="rtl" lang="ar">
                    <head>
                        <meta charset="UTF-8">
                        <style>
                            body { font-family: system-ui, sans-serif; padding: 16px; margin: 0; color: #1e293b; }
                            h1 { color: #5b21b6; }
                            h2 { color: #6d28d9; }
                            ul, ol { padding-right: 20px; }
                        </style>
                    </head>
                    <body>
                        ${userCode}
                    </body>
                    </html>
                `);
                doc.close();
            }

            verifyCodeSolution(actId) {
                try {
                    const userCode = this.activeEditorInstance ? this.activeEditorInstance.getValue() : '';
                    this.state.user.savedCode[actId] = userCode;

                    const parser = new DOMParser();
                    const dom = parser.parseFromString(userCode, 'text/html');

                    const currentAct = this.getCurrentActivity();
                    if (!currentAct) return;

                    // Execute validation rule safely
                    const result = currentAct.validation(dom, userCode);

                    if (result && result.passed) {
                        const existingStatus = this.state.user.progress[actId];
                        if (existingStatus !== 'assisted') {
                            this.state.user.progress[actId] = 'completed';
                        }
                        this.saveStateToStorage();
                    }

                    // Render structured feedback without causing layout wipes
                    this.renderStructuredFeedback(result || {
                        passed: false,
                        review: "لم نتمكن من التحقق من النتيجة بصورة مكتملة.",
                        why: "يرجى مراجعة صياغة الكود ومحاولة التحقق مجدداً.",
                        nextStep: "عدلي الكود ثم اضغطي تحققي من الحل."
                    });
                } catch (err) {
                    console.error("Validation error caught safely:", err);
                    this.renderStructuredFeedback({
                        passed: false,
                        review: "حدث تنبيه أثناء فحص الكود (تأكدي من صحة صياغة الوسوم والتنسيقات).",
                        why: "يتعذر تحليل بعض الوسوم غير المغلقة أو القواعد غير المكتملة.",
                        nextStep: "راجع الأكواد المكتوبة وأصلحي أي أخطاء مطبعية قبل إعادة التحقق."
                    });
                }
            }

            renderStructuredFeedback(res) {
                const panel = document.getElementById('feedback-panel');
                if (!panel) return;

                const isSuccess = res.passed;

                panel.className = `bg-white rounded-2xl p-5 border ${isSuccess ? 'border-emerald-300 bg-emerald-50/30' : 'border-amber-300 bg-amber-50/30'} shadow-sm space-y-3 min-h-[220px] transition-all`;

                panel.innerHTML = `
                    <div class="flex items-center gap-2 pb-2 border-b ${isSuccess ? 'border-emerald-200 text-emerald-800' : 'border-amber-200 text-amber-800'} font-bold text-sm">
                        <span class="text-lg">${isSuccess ? '🎉' : '💡'}</span>
                        <span>${isSuccess ? 'إنجاز رائع! النتيجة صحيحة ومكتملة' : 'بقي تعديل بسيط؛ راجعي الملاحظات ثم حاولي مجدداً'}</span>
                    </div>

                    <div class="space-y-2 text-xs leading-relaxed">
                        ${res.done ? `
                            <div class="p-2.5 rounded-xl bg-emerald-100/70 text-emerald-900 border border-emerald-200">
                                <span class="font-bold block mb-0.5">✔ ما أنجزتِه:</span>
                                ${this.escapeTextContent(res.done)}
                            </div>
                        ` : ''}

                        ${res.review ? `
                            <div class="p-2.5 rounded-xl bg-amber-100/70 text-amber-900 border border-amber-200">
                                <span class="font-bold block mb-0.5">🔍 ما يحتاج مراجعة:</span>
                                ${this.escapeTextContent(res.review)}
                            </div>
                        ` : ''}

                        ${res.why ? `
                            <div class="p-2.5 rounded-xl bg-slate-100 text-slate-700 border border-slate-200">
                                <span class="font-bold block mb-0.5 text-brand-800">📖 القواعد والشرح:</span>
                                ${this.escapeTextContent(res.why)}
                            </div>
                        ` : ''}

                        ${res.nextStep ? `
                            <div class="p-2.5 rounded-xl bg-brand-50 text-brand-900 border border-brand-200 font-medium">
                                <span class="font-bold block mb-0.5">🚀 خطوتكِ التالية:</span>
                                ${this.escapeTextContent(res.nextStep)}
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            prevActivity() {
                this.saveCurrentActivityDraftImmediate();
                const sec = this.getCurrentSection();
                const acts = CURRICULUM_DATA.activities[sec.id] || [];

                if (this.state.activeActivityIdx > 0) {
                    this.state.activeActivityIdx--;
                    this.render();
                }
            }

            nextActivity() {
                this.saveCurrentActivityDraftImmediate();
                const sec = this.getCurrentSection();
                const acts = CURRICULUM_DATA.activities[sec.id] || [];

                if (this.state.activeActivityIdx < acts.length - 1) {
                    this.state.activeActivityIdx++;

            setOverflowMode(mode) {

            updateOverflowDimensions(key, val) {
                this.state.labState.overflow[key] = key === 'textLength' ? val : parseInt(val);
                
                const box = document.getElementById('lab-overflow-target-box');
                if (box) {
                    box.style.width = `${this.state.labState.overflow.boxWidth}px`;
                    box.style.height = `${this.state.labState.overflow.boxHeight}px`;
                    box.style.fontSize = `${this.state.labState.overflow.fontSize}px`;
                    box.style.overflow = this.state.labState.overflow.mode;
                    box.textContent = this.state.labState.overflow.textLength === 'long'
                        ? 'هذا النص الطويل مخصص لاختبار سلوك التمرير overflow بداخل الصناديق ذات المساحات المحددة. عند زيادة حجم الخط أو تصغير الأبعاد يظهر تجاوز المحتوى ويكون حله بإضافة overflow: auto.'
                        : 'نص قصير يتسع بسهولة.';
                }
                this.calculateOverflowMeter();
            }

            calculateOverflowMeter() {
                const box = document.getElementById('lab-overflow-target-box');
                const meter = document.getElementById('overflow-meter-status');
                if (!box || !meter) return;

                const hasOverflowY = box.scrollHeight > box.clientHeight;
                if (hasOverflowY) {
                    meter.className = 'p-2.5 rounded-xl text-xs font-bold text-center bg-amber-100 text-amber-900 border border-amber-200';
                    meter.textContent = 'يوجد تجاوز رأسي بالمحتوى ⚠️ (تظهر أهمية overflow)';
                } else {
                    meter.className = 'p-2.5 rounded-xl text-xs font-bold text-center bg-emerald-100 text-emerald-900 border border-emerald-200';
                    meter.textContent = 'المحتوى يتسع تماماً داخل الصندوق ✓';
                }
            }

            updateBoxModelLab(key, val) {
                const num = parseInt(val);
                this.state.labState.boxModel[key] = num;

                const marginBox = document.getElementById('lab-margin-box');
                const paddingBox = document.getElementById('lab-padding-box');

                if (key === 'margin' && marginBox) marginBox.style.margin = `${num}px`;
                if (key === 'padding' && paddingBox) paddingBox.style.padding = `${num}px`;
            }

            getProjectDefaultTemplate(type) {
                if (type === 'gallery') {

            switchProjectTemplate(type) {

            runProjectPreview() {
                const iframe = document.getElementById('project-preview-iframe');
                if (!iframe) return;

                const code = this.activeEditorInstance ? this.activeEditorInstance.getValue() : '';

                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(code);
                doc.close();
            }

            downloadActiveProjectHtml() {
                const content = this.activeEditorInstance ? this.activeEditorInstance.getValue() : '';

                const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `code_studio_project_${this.state.activeProject}.html`;
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            copyAiPromptHelper() {
                const promptText = `أتعلم تطوير المواقع، وهذا مشروعي. أريد إضافة تحسينات على كودي. ساعدني كمدرب: حدد الجزء الذي أراجعه، واشرح الفكرة، وأعطني خطوة صغيرة وتلميحًا، ثم انتظر محاولتي. لا تعِد كتابة المشروع كاملًا ولا تقدم الحل مباشرة. عند الخطأ اشرح السبب وساعدني على تصحيحه بنفسي.`;
                
                const textarea = document.createElement('textarea');
                textarea.value = promptText;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    this.showToastNotification('تم نسخ البرومبت المساعد بنجاح! يمكنكِ إرساله للذكاء الاصطناعي.');
                } catch (err) {
                    console.error('Copy failed:', err);
                }
                document.body.removeChild(textarea);
            }

            escapeTextContent(str) {
                if (!str) return '';
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            openModal(htmlContent) {
                const backdrop = document.getElementById('modal-backdrop');
                const content = document.getElementById('modal-content');
                if (!backdrop || !content) return;

                content.innerHTML = htmlContent;
                backdrop.classList.remove('hidden');
                setTimeout(() => {
                    content.classList.remove('scale-95', 'opacity-0');
                    content.classList.add('scale-100', 'opacity-100');
                }, 10);
            }

            closeModal() {
                const backdrop = document.getElementById('modal-backdrop');
                const content = document.getElementById('modal-content');
                if (!backdrop || !content) return;

                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    backdrop.classList.add('hidden');
                }, 200);
            }

const StudioText = {
  normalize(value) {
    return String(value ?? '').normalize('NFKC')
      .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي')
      .replace(/[^\p{L}\p{N}]+/gu, '').toLowerCase();
  },
  hasContent(value) { return this.normalize(value).length >= 2; },
  changed(value, baseline) {
    const a = this.normalize(value), b = this.normalize(baseline);
    return this.hasContent(value) && a !== b;
  }
};


// Validation uses browser parsing and computed styles, not whole-source keyword matches.
const StudioChecks = {
  source(raw) { return raw.replace(/<!--[\s\S]*?-->/g, ''); },
  css(raw, selector, required) {
    const parsed = new DOMParser().parseFromString(raw, 'text/html');
    const target = parsed.querySelector(selector);
    if (!target) return false;
    const sheet = new CSSStyleSheet();
    sheet.replaceSync([...parsed.querySelectorAll('style')].map(s => s.textContent).join('\n'));
    const declarations = [];
    function collect(rules) {
      for (const rule of rules) {
        if (rule.selectorText) {
          try { if (target.matches(rule.selectorText)) declarations.push(rule); } catch (_) {}
        } else if (rule.cssRules && (!rule.conditionText || matchMedia(rule.conditionText).matches)) collect(rule.cssRules);
      }
    }
    collect(sheet.cssRules);
    // Require the taught selector to occur in a real, matching rule.
    if (!declarations.some(r => r.selectorText.split(',').some(s => s.trim() === selector))) return false;
    for (const prop of Object.keys(required)) {
      if (!declarations.some(r => r.style.getPropertyValue(prop))) return false;
    }
    parsed.querySelectorAll('script,link,meta,base,iframe,object,embed,svg,math').forEach(e => e.remove());
    parsed.querySelectorAll('*').forEach(el => {
      for (const a of [...el.attributes]) if (/^on/i.test(a.name) || /^(src|srcset|href|action|formaction)$/i.test(a.name)) el.removeAttribute(a.name);
    });
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-same-origin');
    frame.style.cssText = 'position:absolute;left:-10000px;top:0;width:600px;height:400px;border:0;visibility:hidden';
    document.body.append(frame);
    try {
      const d = frame.contentDocument;
      d.open(); d.write('<!doctype html><html><head></head><body></body></html>'); d.close();
      const csp = d.createElement('meta'); csp.httpEquiv = 'Content-Security-Policy';
      csp.content = "default-src 'none'; style-src 'unsafe-inline'"; d.head.append(csp);
      for (const s of parsed.querySelectorAll('style')) { const n = d.createElement('style'); n.textContent = s.textContent; d.head.append(n); }
      d.body.innerHTML = parsed.body.innerHTML;
      const el = d.querySelector(selector);
      if (!el) return false;
      const expected = el.cloneNode(false); expected.removeAttribute('id');
      for (const [prop,value] of Object.entries(required)) expected.style.setProperty(prop,value,'important');
      el.parentNode.insertBefore(expected, el.nextSibling);
      const actualStyle = frame.contentWindow.getComputedStyle(el);
      const expectedStyle = frame.contentWindow.getComputedStyle(expected);
      const expand = p => p === 'padding' || p === 'margin' ? ['top','right','bottom','left'].map(s=>p+'-'+s) : p === 'border' ? ['top','right','bottom','left'].flatMap(s=>['width','style','color'].map(v=>'border-'+s+'-'+v)) : p === 'overflow' ? ['overflow-x','overflow-y'] : [p];
      return Object.keys(required).every(p => expand(p).every(k=>actualStyle.getPropertyValue(k) === expectedStyle.getPropertyValue(k)));
    } finally { frame.remove(); }
  },
  behavior(raw, index) {
    return new Promise(resolve => {
      const frame = document.createElement('iframe');
      frame.setAttribute('sandbox','allow-scripts');
      frame.style.cssText='position:absolute;left:-10000px;width:600px;height:400px;visibility:hidden';
      const token = crypto.randomUUID(); let finished = false;
      const finish = result => { if(finished)return; finished=true; clearTimeout(timer); window.removeEventListener('message',listen); frame.remove(); resolve(result); };
      const listen = e => { if(e.source === frame.contentWindow && e.data?.studioCheck === token) finish(e.data); };
      const timer = setTimeout(()=>finish({passed:false,error:'لم تكتمل تجربة الزر؛ راجعي الكود ثم حاولي مجددًا.'}),2500);
      window.addEventListener('message',listen);
      function runner(token,index) {
        const send = parent.postMessage.bind(parent); const alerts=[]; const errors=[];
        const norm=t=>String(t??'').normalize('NFKC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[^\p{L}\p{N}]+/gu,'').toLowerCase();
        const has=t=>norm(t).length>=2;
        window.alert = text => alerts.push(String(text));
        window.addEventListener('error',()=>errors.push('execution'));
        window.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{
          const msg=document.getElementById('msg'),title=document.getElementById('title'),box=document.getElementById('box');
          const before={msg:msg?.textContent,color:title?getComputedStyle(title).color:null,display:box?getComputedStyle(box).display:null};
          const buttons=[...document.querySelectorAll('button')];
          if(!buttons.length){send({studioCheck:token,passed:false},'*');return;}
          buttons[0].click();
          setTimeout(()=>{
            let passed=false;
            if(index===1) passed=alerts.some(t=>has(t)&&norm(t)!==norm('مرحباً بكِ'));
            if(index===2) passed=!!msg && has(msg.textContent) && norm(msg.textContent)!==norm(before.msg) && norm(msg.textContent)!==norm('مرحباً');
            if(index===3) passed=!!title && before.color!=='rgb(255, 0, 0)' && getComputedStyle(title).color==='rgb(255, 0, 0)';
            if(index===4) passed=!!box && before.display!=='none' && getComputedStyle(box).display==='none';
            send({studioCheck:token,passed:passed && !errors.length},'*');
          },80);
        },0));
      }
      const bootstrap = '('+runner.toString()+')('+JSON.stringify(token)+','+index+');';
      // Split the closing tag so this file remains safe inside the outer HTML script.
      frame.srcdoc = '<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; script-src &#39;unsafe-inline&#39;; style-src &#39;unsafe-inline&#39;;"><script>'+bootstrap+'<'+'/script>'+raw;
      document.body.append(frame);
    });
  }
};

// Keep preview execution in a unique opaque origin; student scripts cannot reach this app.
function prepareStudioPreview(code) {
 const d=new DOMParser().parseFromString(code,'text/html');
 d.documentElement.dir='rtl';d.documentElement.lang='ar';
 if(!d.querySelector('meta[charset]')){const m=d.createElement('meta');m.charset='UTF-8';d.head.prepend(m);}
 const base=d.createElement('style');base.textContent='body{font-family:system-ui,sans-serif;padding:16px;margin:0;color:#1e293b}';d.head.prepend(base);
 const alerts=d.createElement('script');alerts.textContent='window.alert=function(text){var p=document.createElement("p");p.setAttribute("role","alert");p.style.cssText="padding:12px;border:2px solid #7c3aed;background:#f5f3ff";p.textContent=String(text);document.body.append(p)}';d.head.prepend(alerts);
 for(const img of d.querySelectorAll('img[src="photo.jpg"]'))img.src=STUDIO_IMAGE;
 for(const s of d.querySelectorAll('source[src],video[src]'))if(/^(movie|intro|clip|lesson)\.webm$/.test(s.getAttribute('src'))){s.src=STUDIO_VIDEO;if(s.tagName==='SOURCE')s.type='video/webm';}
 return '<!doctype html>'+d.documentElement.outerHTML;
}

CodeStudioApp.prototype.verifyCodeSolution=async function(actId){
 const code=this.activeEditorInstance?.getValue()||'';const act=this.getCurrentActivity();if(!act||act.id!==actId)return;
 const token=(this._validationToken||0)+1;this._validationToken=token;
 this.state.user.savedCode[actId]=code;
 const panel=document.getElementById('feedback-panel');if(panel)panel.textContent='جارٍ التحقق من الحل…';
 try{
   const result=await act.validation(new DOMParser().parseFromString(code,'text/html'),code);
   if(token!==this._validationToken||this.getCurrentActivity()?.id!==actId||this.activeEditorInstance?.getValue()!==code)return;
   if(result.passed){if(this.state.user.progress[actId]!=='assisted')this.state.user.progress[actId]='completed';this.saveStateToStorage();}
   this.renderStructuredFeedback(result);
 }catch(error){console.error('Validation failed',error);this.renderStructuredFeedback({passed:false,review:'تعذر تشغيل الفحص بسبب خطأ داخلي. احتفظنا بكودك؛ حاولي مجددًا.',why:'هذه مشكلة في أداة التحقق ولا تعني أن حلك خاطئ.',nextStep:'أعيدي التحقق، وأخبري المعلمة إذا تكرر التنبيه.'});}
};

CodeStudioApp.prototype.restoreProgressBackup=function(){
 try{
  const backup=JSON.parse(document.getElementById('progress-backup-text').value);if(backup.version!==1||!backup.user||typeof backup.user!=='object')throw Error('format');
  const input=backup.user;const ids=new Set(Object.values(CURRICULUM_DATA.activities).flat().map(a=>a.id));

  this._validationToken=(this._validationToken||0)+1;
  this.state.user={...this.state.user,name:typeof input.name==='string'?input.name.slice(0,60):this.state.user.name,savedCode,progress,projectDrafts};
  this.saveStateToStorage();this.closeModal();if(this.activeEditorInstance){this.activeEditorInstance.destroy();this.activeEditorInstance=null;}this.state.currentView='home';this.render();this.showToastNotification('استُعيدت نسخة التقدم بنجاح.');
 }catch(_){document.getElementById('progress-backup-status').textContent='تعذر قراءة النسخة. اختاري ملف تقدم صحيحًا صادرًا من الاستوديو.';}
};

.hero{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:38px;padding:50px 0}.hero h1{font-size:clamp(34px,5vw,62px);line-height:1.2;letter-spacing:-1px;margin:20px 0}.hero p{max-width:520px}.hero img{width:100%;border-radius:30px;box-shadow:0 18px 50px #17203320;animation:float 5s ease-in-out infinite}
button,.button{border:0;border-radius:14px;background:var(--accent);color:white;padding:12px 20px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{filter:brightness(1.1)}.secondary{background:var(--soft);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:var(--card);border:1px solid #94a3b830;border-radius:24px;padding:22px;transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-7px);box-shadow:0 16px 35px #17203315}.card img{width:100%;height:170px;object-fit:cover;border-radius:16px}.card h3{margin-bottom:5px}.muted{opacity:.7}.section-title{margin-top:55px}.banner{padding:28px;border-radius:24px;background:var(--soft);margin:35px 0}.tag{font-size:12px;border-radius:30px;background:var(--soft);padding:5px 11px;display:inline-block}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
video{width:100%;max-height:360px;border-radius:22px;background:#172033}.media{margin:35px 0;padding:25px;background:var(--card);border-radius:26px}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:18px;overflow:hidden}th,td{text-align:right;padding:15px;border-bottom:1px solid #94a3b830}th{background:var(--soft)}.table-wrap{overflow:auto}footer{font-size:14px;border-top:1px solid #94a3b830;margin-top:50px}.extra{display:none}.extra.open{display:block}body.dark{--paper:#101728;--ink:#f1f5f9;--card:#1e293b;--soft:#334155}.counter{font-size:28px;font-weight:900;color:var(--accent)}
@keyframes float{50%{transform:translateY(-12px)}}@media(max-width:700px){.hero,.grid{grid-template-columns:1fr}.hero{padding:25px 0;gap:20px}.hero img{max-height:280px;object-fit:cover}header,main,footer{padding:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
`;

function projectDocument(type){
 const isGallery=type==='gallery',isMagazine=type==='magazine';
 const title=isGallery?'معرضي الرقمي':isMagazine?'ومضة تقنية':'نادي صانعات المستقبل';
 const subtitle=isGallery?'أفكار تتحول إلى أعمال تُرى':isMagazine?'نقرأ المستقبل… ونكتب أفكارنا':'فكرتك اليوم… مشروعنا القادم';
 const image=isGallery?'creative.svg':isMagazine?'discovery.svg':'campus.svg';
 const cards=isGallery?
 `<article class="card" data-kind="design"><img src="creative.svg" alt="تكوين فني هندسي"><span class="tag">تصميم</span><h3>هوية فعالية مدرسية</h3><p>✏️ اكتبي فكرة تصميمك والأداة التي استخدمتِها.</p><button class="secondary" onclick="like(this)">أعجبني · 0</button></article>
<article class="card" data-kind="web"><img src="campus.svg" alt="رسم مدرسة"><span class="tag">ويب</span><h3>موقع يخدم مدرستي</h3><p>✏️ ما المشكلة التي يحلها موقعك؟</p><button class="secondary" onclick="like(this)">أعجبني · 0</button></article>
<article class="card" data-kind="design"><img src="discovery.svg" alt="تصميم عن الاكتشاف"><span class="tag">تصميم</span><h3>ملصق فكرة علمية</h3><p>✏️ أضيفي وصفًا مختصرًا لعملك الثالث.</p><button class="secondary" onclick="like(this)">أعجبني · 0</button></article>`:
 isMagazine?
 `<article class="card"><span class="tag">ذكاء اصطناعي</span><h3>كيف نتعلم بذكاء؟</h3><p>✏️ اكتبي مقدمة مقال من فكرتك، لا تنقلي النص التجريبي.</p><p class="extra">✏️ هذه مساحة لتفاصيل المقال ومثال من حياتك المدرسية.</p><button class="secondary" onclick="expandArticle(this)">اقرئي المزيد</button></article>
<article class="card"><span class="tag">أمن رقمي</span><h3>خصوصيتك قرارك</h3><p>✏️ أضيفي نصيحة عملية لحماية البيانات.</p><p class="extra">✏️ اشرحي موقفًا يساعد القارئة على فهم النصيحة.</p><button class="secondary" onclick="expandArticle(this)">اقرئي المزيد</button></article>
<article class="card"><span class="tag">ابتكار</span><h3>فكرة تستحق التجربة</h3><p>✏️ اطرحي سؤالًا علميًا يشغلك.</p><p class="extra">✏️ اقترحي تجربة بسيطة أو مصدرًا للتعلم مع ذكر الرابط.</p><button class="secondary" onclick="expandArticle(this)">اقرئي المزيد</button></article>`:
 `<article class="card"><span class="tag">01 · اكتشفي</span><h3>ورشة تصميم المواقع</h3><p>✏️ غيّري اسم الورشة ووصفها وموعدها.</p></article>
<article class="card"><span class="tag">02 · اصنعي</span><h3>تحدي فكرة مفيدة</h3><p>✏️ ما الفكرة التي ستقدمها مجموعتك للمدرسة؟</p></article>
<article class="card"><span class="tag">03 · شاركي</span><h3>معرض المبتكرات</h3><p>✏️ أضيفي دعوة قصيرة تشجع زميلاتك على المشاركة.</p></article>`;
 const filters=isGallery?'<div class="filters"><button onclick="filterWork(\'all\')">كل الأعمال</button><button class="secondary" onclick="filterWork(\'design\')">التصميم</button><button class="secondary" onclick="filterWork(\'web\')">المواقع</button></div>':'';
 const table=isMagazine?'<h2 class="section-title">مفكرة التقنية</h2><div class="table-wrap"><table><tr><th>الموضوع</th><th>الكاتبة</th><th>موعد النشر</th></tr><!-- ✏️ غيّري بيانات الصف وأضيفي صفًا جديدًا باستخدام tr وtd. --><tr><td>استخدام التقنية بوعي</td><td>فريق المجلة</td><td>الأسبوع الأول</td></tr></table></div>':'';
 const script=`
// ✏️ 6: عدّلي التفاعل بعد فهمه. جرّبي تغيير نص الزر أو قيمة العداد.
function toggleTheme(){document.body.classList.toggle('dark')}
function joinClub(){const n=document.getElementById('joined');n.textContent=Number(n.textContent)+1;document.getElementById('welcome').textContent='سعداء بانضمامك إلى الفكرة!'}
function like(button){const n=Number(button.dataset.likes||0)+1;button.dataset.likes=n;button.textContent='أعجبني · '+n}
function filterWork(kind){document.querySelectorAll('[data-kind]').forEach(card=>card.hidden=kind!=='all'&&card.dataset.kind!==kind)}
function expandArticle(button){const more=button.parentElement.querySelector('.extra');more.classList.toggle('open');button.textContent=more.classList.contains('open')?'عرض أقل':'اقرئي المزيد'}
`;
 return '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>'+title+'</title>\n<style>'+PROJECT_CSS+(isGallery?'\n:root{--accent:#0891b2;--paper:#eefcff;--soft:#cffafe}':isMagazine?'\n:root{--accent:#c2410c;--paper:#fffaf3;--soft:#ffedd5}':'')+'</style>\n</head>\n<body>\n<!-- ✏️ 2: استبدلي اسم المشروع وروابط التنقل بما يناسب فكرتك. -->\n<header><nav><strong class="brand">'+title+'</strong><div><a href="#work">'+(isGallery?'أعمالي':'المحتوى')+'</a><a href="#film">الفيديو</a><button class="secondary" onclick="toggleTheme()">غيّري الأجواء ☾</button></div></nav></header>\n<main>\n<section class="hero"><div><span class="pill">مشروع قابل للتطوير · من إبداعك</span>\n<!-- ✏️ 3: اكتبي عنوانًا جديدًا وفقرة تعريفية من أسلوبك. -->\n<h1>'+subtitle+'</h1><p>✏️ هذا قالب بداية. اكتبي هنا رسالة مشروعك، ولمن صممته، وما الذي يجعله مختلفًا.</p><a class="button" href="#work">اكتشفي التفاصيل</a></div>\n<!-- ✏️ 4: لتغيير الصورة استبدلي src برابط صورة مناسب، وعدّلي alt ليصف صورتك. الصور الافتراضية يوفرها الاستوديو. -->\n<img src="'+image+'" alt="رسم توضيحي لفكرة المشروع"></section>\n<section id="work"><h2>مساحة '+(isGallery?'أعمالي':isMagazine?'الأفكار والمقالات':'الأنشطة')+'</h2>\n<!-- ✏️ انسخي article كاملة لإضافة بطاقة؛ غيّري العنوان والنص، ثم راجعي المعاينة. -->\n'+filters+'<div class="grid">'+cards+'</div></section>\n'+table+'\n<section class="media" id="film"><h2>شاهدِي الفكرة تتحرك</h2><p>✏️ اكتبي وصف الفيديو وسبب إضافته للمشروع.</p>\n<!-- ✏️ 5: استبدلي src في source برابط فيديوك أو اسمه الحقيقي. أبقي controls حتى تستطيع الزائرة تشغيله. عينة الاستوديو صامتة. -->\n<video controls playsinline preload="metadata" poster="'+image+'"><source src="lesson.webm" type="video/webm">متصفحك لا يدعم الفيديو.</video></section>\n<section class="banner"><h2>فكرة صغيرة… أثر جميل</h2><p id="welcome">✏️ اكتبي دعوة مرتبطة بهدف مشروعك.</p><button onclick="joinClub()">أشارك بالفكرة</button> <span class="counter" id="joined">0</span><p class="muted">عداد تجريبي داخل الصفحة، ولا يسجل بيانات أو مشاركات فعلية.</p></section>\n<!-- ⭐ تحدي إضافي: أضيفي بطاقة، ثم غيّري شكل الشبكة. جرّبي صورة بديلة وتفاعلًا جديدًا، واختبري الصفحة بعرض صغير. -->\n</main>\n<footer>إعداد: ✏️ اكتبي اسمك أو اسم فريقك · مصادر الصور والفيديو: ✏️ اكتبي المصادر عند الاستبدال.</footer>\n<script>'+script+'<'+'/script>\n</body>\n</html>';
}
CodeStudioApp.prototype.getProjectDefaultTemplate=projectDocument;
const originalProjectRenderer=CodeStudioApp.prototype.renderProjectView;
CodeStudioApp.prototype.renderProjectView=function(){
 const view=originalProjectRenderer.call(this),guide=document.createElement('section');
 guide.className='p-5 bg-white border border-brand-200 rounded-2xl space-y-3';
 guide.innerHTML='<h3 class="font-bold text-brand-900">خريطة تطوير مشروعك ✨</h3><p class="text-sm">القالب يعمل من البداية؛ مهمتكِ تحويله إلى عملك أنتِ. التعليقات المبدوءة بـ ✏️ داخل الكود تدلّك على مواضع التعديل.</p><ol class="list-decimal list-inside text-sm space-y-2"><li>اختاري موضوعًا، ثم غيّري العنوان والفقرة وأسماء البطاقات.</li><li>غيّري الألوان في :root، ولاحظي تغيّر الهوية كاملة.</li><li>استبدلي صورة وفيديو، وعدّلي الوصف البديل ومصادر الوسائط.</li><li>أضيفي بطاقة أو صف جدول، وعدّلي تفاعلًا واحدًا بعد فهمه.</li><li>اختبري الأزرار والروابط والعرض الصغير، ثم اشرحي لزميلتكِ تعديلين نفّذتِهما.</li></ol><details class="text-sm"><summary class="cursor-pointer font-bold">أفكار ترفعين بها مستوى العمل</summary><p>قائمة أسئلة شائعة، تصنيف جديد للأعمال، زر إظهار التفاصيل، مقارنة قبل وبعد، صفحة موارد، أو تحسين الوصول باستخدام تسميات واضحة وتباين مقروء.</p></details><div class="flex flex-wrap gap-3"><button class="p-3 bg-brand-100 rounded text-sm" onclick="app.confirmEnhancedProject()">بدء القالب المطوّر لهذا المشروع</button><button class="p-3 bg-slate-100 rounded text-sm" onclick="app.restorePreviousProject()">استعادة مسودتي السابقة</button></div>';
 view.prepend(guide);return view;
};
CodeStudioApp.prototype.confirmEnhancedProject=function(){this.openModal('<h3 class="font-bold mb-3">بدء القالب المطوّر؟</h3><p class="text-sm mb-4">سنحفظ مسودتك الحالية كنسخة سابقة، ثم نفتح القالب المطوّر. يمكنك استعادتها بالزر المخصص.</p><button class="p-3 bg-brand-100 rounded" onclick="app.startEnhancedProject()">حفظ المسودة وفتح القالب</button> <button class="p-3 bg-slate-100 rounded" onclick="app.closeModal()">إلغاء</button>');};
CodeStudioApp.prototype.startEnhancedProject=function(){const type=this.state.activeProject||'club';const old=this.activeEditorInstance?.getValue()??this.state.user.projectDrafts[type];if(old!==undefined)this.state.user.projectDrafts[type+'-previous']=old;this.state.user.projectDrafts[type]=projectDocument(type);this.saveStateToStorage();this.closeModal();this.render();};
CodeStudioApp.prototype.restorePreviousProject=function(){const type=this.state.activeProject||'club',previous=this.state.user.projectDrafts[type+'-previous'];if(previous===undefined){this.showToastNotification('لا توجد مسودة سابقة لهذا المشروع.');return;}this.state.user.projectDrafts[type+'-previous']=this.activeEditorInstance?.getValue()||'';this.state.user.projectDrafts[type]=previous;this.saveStateToStorage();this.render();this.showToastNotification('استُعيدت المسودة السابقة؛ ويمكنك التبديل مجددًا بالزر نفسه.');};

const originalPrepareProjectMedia=prepareStudioPreview;
prepareStudioPreview=function(code){const d=new DOMParser().parseFromString(originalPrepareProjectMedia(code),'text/html');for(const img of d.querySelectorAll('img[src]')){const src=img.getAttribute('src');if(STUDIO_PROJECT_ASSETS[src])img.src=STUDIO_PROJECT_ASSETS[src];}for(const v of d.querySelectorAll('video[poster]')){const src=v.getAttribute('poster');if(STUDIO_PROJECT_ASSETS[src])v.poster=STUDIO_PROJECT_ASSETS[src];}return '<!doctype html>'+d.documentElement.outerHTML;};
CodeStudioApp.prototype.downloadActiveProjectHtml=function(){const code=this.activeEditorInstance?.getValue()||'';const content=prepareStudioPreview(code);const url=URL.createObjectURL(new Blob([content],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='code_studio_project_'+(this.state.activeProject||'club')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};

CodeStudioApp.prototype.copyAiPromptHelper=function(){
 const code=this.activeEditorInstance?.getValue()||'';
 const prompt='أنا طالبة أتعلم HTML وCSS وJavaScript. هذا مشروعي الحالي. هدفي: [اكتبي التعديل الذي تريدينه].\nساعدني كمدرب: اشرح الفكرة ببساطة، وحدد الوسم أو الخاصية التي أراجعها، وأعطني خطوة صغيرة وتلميحًا ثم انتظر محاولتي. لا تكتب المشروع كاملًا ولا تمسح عملي. لا تشترط نصًا حرفيًا؛ ركز على صحة البرمجة وتحقيق التغيير. بعد محاولتي اشرح ما نجح وما يحتاج تعديلًا، ثم اقترح تحسينًا واحدًا يناسب مستواي.\n\nكودي الحالي:\n'+code;
 this.openModal('<h3 class="font-bold mb-3">برومبت المساعد التعليمي</h3><p class="text-xs mb-3">النص كامل أمامك. عدّلي خانة الهدف، ثم انسخيه إلى المساعد الذي تختارينه. يتضمن كود المشروع الحالي.</p><textarea id="studio-ai-prompt" aria-label="برومبت المساعدة" dir="rtl" class="w-full h-64 p-3 border rounded text-sm">'+this.escapeTextContent(prompt)+'</textarea><p id="studio-ai-copy-status" class="text-xs my-3" role="status"></p><button class="p-3 bg-brand-100 rounded" onclick="app.copyVisibleAiPrompt()">نسخ النص</button> <button class="p-3 bg-slate-100 rounded" onclick="app.closeModal()">إغلاق</button>');
 this.copyVisibleAiPrompt();
};
CodeStudioApp.prototype.copyVisibleAiPrompt=async function(){
 const field=document.getElementById('studio-ai-prompt'),status=document.getElementById('studio-ai-copy-status');if(!field||!status)return;
 let copied=false;
 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(field.value);copied=true;}}catch(_){}
 if(!copied){field.focus();field.select();try{copied=document.execCommand('copy')===true;}catch(_){}}
 status.textContent=copied?'تم نسخ النص. الصقيه في المساعد، واكتبي هدفك قبل الإرسال.':'النسخ التلقائي غير متاح في هذا المتصفح. النص محدد؛ استخدمي Ctrl+C، أو الضغط المطوّل ثم نسخ على الجوال.';
};

        // Initialize Global App
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new CodeStudioApp();
            app.installBackupControls();
        });
    </script>
